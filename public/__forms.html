<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Form definitions</title>
  </head>
  <body>
    <!--
      NETLIFY FORMS BLUEPRINT — not a user-facing page.

      Next.js renders the real form through React, but Netlify discovers forms by
      scanning static HTML during deployment. This hidden form registers the form
      and its allowed fields. Keep its name and field names synchronized with
      components/forms/ContactForm.tsx.
    -->
    <form
      name="project-enquiry"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <!-- Associates submitted data with "project-enquiry" in the Netlify dashboard. -->
      <input type="hidden" name="form-name" value="project-enquiry" />

      <!--
        Spam honeypot: human visitors never see or fill this field. Automated bots
        often fill every input, allowing Netlify and the edge guard to discard them.
      -->
      <input type="text" name="bot-field" />

      <!-- Field definitions only; the styled and accessible inputs live in React. -->
      <input type="text" name="name" minlength="2" maxlength="100" />
      <input type="email" name="email" maxlength="255" />
      <input
        type="tel"
        name="phone"
        pattern="\+[0-9]{1,3} [0-9]{4,14}"
        maxlength="17"
      />
      <input type="text" name="company" maxlength="100" />
      <input type="text" name="subject" minlength="5" maxlength="200" />
      <textarea name="message" minlength="10" maxlength="5000"></textarea>
      <input type="checkbox" name="subscribe" />
    </form>
  </body>
</html>
